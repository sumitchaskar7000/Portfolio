<?xml version="1.0" encoding="UTF-8"?>
<svg width="240" height="60" viewBox="0 0 240 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Logo Container -->
  <g transform="translate(10, 10)">
    <!-- Modern SC Monogram -->
    <g filter="url(#shadow)">
      <!-- Background Circle -->
      <circle cx="30" cy="30" r="30" fill="white"/>
      <circle cx="30" cy="30" r="28" fill="url(#logoGradient)"/>
      
      <!-- S Letter -->
      <path d="M25 20C21.134 20 18 23.134 18 27C18 30.866 21.134 34 25 34C28.866 34 32 30.866 32 27C32 23.134 28.866 20 25 20ZM25 32C22.239 32 20 29.761 20 27C20 24.239 22.239 22 25 22C27.761 22 30 24.239 30 27C30 29.761 27.761 32 25 32Z" fill="white"/>
      
      <!-- C Letter -->
      <path d="M35 20C31.134 20 28 23.134 28 27C28 30.866 31.134 34 35 34C38.866 34 42 30.866 42 27C42 23.134 38.866 20 35 20ZM35 32C32.239 32 30 29.761 30 27C30 24.239 32.239 22 35 22C37.761 22 40 24.239 40 27C40 29.761 37.761 32 35 32Z" fill="white"/>
    </g>
  </g>

  <!-- Text -->
  <g transform="translate(80, 35)">
    <!-- Sumit Text -->
    <text font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#1e293b">
      <tspan x="0" y="0">Sumit</tspan>
    </text>
    
    <!-- Chaskar Text with Gradient -->
    <text font-family="Inter, sans-serif" font-size="24" font-weight="700">
      <tspan x="0" y="30" fill="url(#logoGradient)">Chaskar</tspan>
    </text>
  </g>

  <!-- Professional Tagline -->
  <g transform="translate(80, 50)">
    <text font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748b">
      <tspan x="0" y="0">Full Stack Developer</tspan>
    </text>
  </g>
</svg> 